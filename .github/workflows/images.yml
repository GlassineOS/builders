# Builds, tests and publishes the builder images to ghcr.io/glassineos/<image>.
# Pull requests build and test only. main, the weekly rebuild (security updates) and
# manual runs also push. Tags: <base> (moving), <base>-YYYYMMDD (frozen), sha-<commit>.
# Consumers pin by digest or a dated tag, never the moving tag in release builds.
name: images
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kernel-build
            base: trixie
            platforms: linux/amd64
          - image: alpine-build
            base: "3.22"
            platforms: linux/arm64,linux/amd64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Tags
        id: tags
        run: |
          img=ghcr.io/glassineos/${{ matrix.image }}
          b=${{ matrix.base }}
          echo "list=$img:$b,$img:$b-$(date -u +%Y%m%d),$img:sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Build and test each platform
        run: |
          for p in $(echo "${{ matrix.platforms }}" | tr , ' '); do
            docker buildx build --load --platform "$p" -t test:local \
              --cache-from "type=gha,scope=${{ matrix.image }}-${p#*/}" \
              --cache-to "type=gha,mode=max,scope=${{ matrix.image }}-${p#*/}" \
              ${{ matrix.image }}
            docker run --rm --platform "$p" -v "$PWD/${{ matrix.image }}/test.sh:/t.sh:ro" test:local sh /t.sh
          done
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}-amd64
            type=gha,scope=${{ matrix.image }}-arm64
